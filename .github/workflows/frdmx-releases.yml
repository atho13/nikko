name: Frdmx Wrt Build & Releases

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: Force Strip & Compress Mihomo Core (IPK & APK Mod)
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl tree
          
          cd bin/packages/${{ matrix.arch }}/nikki || exit 1
          
          for file in mihomo*.ipk; do
            [ -f "$file" ] || continue
            echo "Memproses kompresi kustom IPK: $file"
            mkdir -p tmp_extract
            tar -xf "$file" -C tmp_extract
            if [ -f tmp_extract/data.tar.gz ]; then
              tar -xf tmp_extract/data.tar.gz -C tmp_extract
              bin_file=$(find tmp_extract/usr/bin/ -type f -name "mihomo*" 2>/dev/null)
              if [ -f "$bin_file" ]; then
                strip -s "$bin_file" || true
                upx --ultra --brute "$bin_file" || true
                rm -f tmp_extract/data.tar.gz
                cd tmp_extract && tar -czf data.tar.gz usr/ && cd ..
                rm -f "$file"
                cd tmp_extract && tar -czf "../$file" debian-binary control.tar.gz data.tar.gz && cd ..
              fi
            fi
            rm -rf tmp_extract
          done

          for file in mihomo*.apk; do
            [ -f "$file" ] || continue
            echo "Memproses kompresi kustom APK: $file"
            mkdir -p tmp_extract_apk
            # APK OpenWrt adalah arsip tar yang dikompres dengan gzip atau zstd
            tar -xf "$file" -C tmp_extract_apk
            bin_file=$(find tmp_extract_apk/usr/bin/ -type f -name "mihomo*" 2>/dev/null)
            if [ -f "$bin_file" ]; then
              echo "Biner Mihomo APK ditemukan! Memotong simbol debug & mengompres..."
              strip -s "$bin_file" || true
              upx --ultra --brute "$bin_file" || true
              # Bungkus ulang struktur APK OpenWrt asli
              rm -f "$file"
              cd tmp_extract_apk && tar -czf "../$file" . && cd ..
            fi
            rm -rf tmp_extract_apk
          done
          
          cd ../../../..

      - name: compress
        run: |
          tar -c -z -f nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz -C bin/packages/${{ matrix.arch }}/nikki .
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/nikki/. public/${{ matrix.branch }}/${{ matrix.arch }}/
          tar -c -z -f feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz public/${{ matrix.branch }}/${{ matrix.arch }}

      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v'))
        name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

  feed:
    needs: release
    name: feed
    runs-on: ubuntu-latest

    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          pattern: feed_nikki_*
          merge-multiple: true
      
      - name: uncompress
        run: |
          for file in feed_nikki_*.tar.gz; do tar -x -z -f "$file"; done
      
      - name: prepare
        run: |
          sudo apt-get update && sudo apt-get install -y tree
          mkdir -p public
          echo "${{ secrets.KEY_BUILD_PUB }}" > public/key-build.pub
          echo "${{ secrets.PUBLIC_KEY }}" > public/public-key.pem
          tree --dirsfirst --sort name -P '*.apk|*.ipk' --prune --noreport -H "" -T "Nikki's Feed" --charset utf-8 -o public/index.html public
          sed -i '/<p class="VERSION">/,/<\/p>/d' public/index.html

      - name: feed
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=nikkinikki
